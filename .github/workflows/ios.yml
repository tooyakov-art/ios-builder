# Сборка iOS → TestFlight на бесплатном macOS-раннере (репозиторий публичный, код приложения — закрытый).
# Код приложения сюда не попадает: клонируется на раннер по deploy key (только чтение) и умирает вместе с машиной.
# Публичный лог — только «ok / упал» по шагам; полный лог — зашифрованный артефакт (живёт 2 дня).
#
# Секреты (Settings → Secrets → Actions):
#   ONETAP_REPO, ONETAP_DEPLOY_KEY          — какой закрытый репо клонировать и ключ только на чтение
#   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#   APP_STORE_CONNECT_PRIVATE_KEY (.p8 целиком), CERTIFICATE_PRIVATE_KEY (RSA-ключ сертификата)
#                                           — появятся после членства Apple; без них workflow только проверяет сборку
# Переменные (Settings → Variables): BUNDLE_ID, API_BASE_URL, APP_STORE_APPLE_ID (числовой id карточки, необязательно)
# simtest / emutest (25.11): поле номера на симуляторе iPhone (XCUITest) и эмуляторе Android — из папки simtest/, наружу только скрины и текст (1 день).
name: ios

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build-check = сборка без подписи · testflight = подпись + загрузка · metadata = тексты и скрины · submit = тексты + отправка версии на проверку Apple (ручной выпуск) · status = только прочитать состояние версии в App Store Connect · release = выпустить одобренную версию release_version в App Store · simtest = поле номера на симуляторе iPhone (XCUITest, экранная клавиатура) · emutest = то же на эмуляторе Android"
        type: choice
        options: [testflight, build-check, metadata, submit, status, release, simtest, emutest]
        default: testflight
      simtest_submit:
        description: Для simtest — нажать «Получить код» на тестовом номере +7 700 000 19 19 (запрос на прод; не чаще раза в минуту)
        type: boolean
        default: false
      release_version:
        description: Версия для режима release (например 0.2.1) — выпускается, только если Apple одобрила и она ждёт выпуска разработчиком
        type: string
        default: ""
      ref:
        description: Ветка закрытого репо
        type: string
        default: release/ios-appstore
      build_number:
        description: Номер сборки TestFlight для режима submit (latest = последняя)
        type: string
        default: latest
      run_tests:
        description: Прогнать flutter test (дольше на ~10 мин)
        type: boolean
        default: false
      runner:
        description: Раннер macOS (если долго в очереди — сменить; нужен Xcode 26)
        type: choice
        options: [macos-15-intel, macos-latest, macos-15, macos-26]
        default: macos-15-intel

# только по кнопке/API — ни push, ни pull_request: чужие PR не получают ни секретов, ни запуска
permissions:
  contents: read

concurrency:
  # simtest разных веток идут параллельно (0.2.1 и 0.2.2 сравниваем рядом); остальные режимы — по одному, как раньше
  group: ios-${{ inputs.mode }}${{ (inputs.mode == 'simtest' || inputs.mode == 'emutest') && format('-{0}', inputs.ref) || '' }}
  cancel-in-progress: false

jobs:
  ios:
    if: ${{ inputs.mode != 'status' && inputs.mode != 'release' && inputs.mode != 'simtest' && inputs.mode != 'emutest' }}   # 25.11: status, release, simtest, emutest — отдельные задачи ниже
    # 21.10: arm64 (macos-26 / macos-latest) не выдали за 15 мин — «capacity constraints»; Intel взялся за секунды
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 75
    env:
      MODE: ${{ inputs.mode }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      APP_STORE_APPLE_ID: ${{ vars.APP_STORE_APPLE_ID }}
      FLUTTER_VERSION: 3.47.7   # та же версия, что собрала Android 0.2.0
      APP_DIR: ${{ github.workspace }}/app
    steps:
      - name: Скрипты сборщика
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Проверка секретов
        id: pre
        env:
          HAS_REPO: ${{ secrets.ONETAP_REPO != '' && secrets.ONETAP_DEPLOY_KEY != '' }}
          HAS_ASC: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_KEY_IDENTIFIER != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' && secrets.CERTIFICATE_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_REPO" != "true" ]; then
            echo "::error title=Нет доступа к коду::нужны секреты ONETAP_REPO и ONETAP_DEPLOY_KEY"; exit 1
          fi
          [ -n "$BUNDLE_ID" ] && [ -n "$API_BASE_URL" ] || { echo "::error title=Нет переменных::нужны BUNDLE_ID и API_BASE_URL"; exit 1; }
          sign=false
          if [ "$MODE" != "build-check" ]; then
            if [ "$HAS_ASC" = "true" ]; then
              sign=true
            else
              # идея: ключа Apple ещё нет — не падаем непонятно, а проверяем сборку и ясно пишем, чего ждём
              echo "::warning title=Ждёт ключ App Store Connect::нет секретов APP_STORE_CONNECT_* / CERTIFICATE_PRIVATE_KEY — подпись и загрузка пропущены, делаю только проверку сборки"
            fi
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE, подпись=$sign"

      - name: Xcode 26 (Apple с 04.2026 принимает только сборки на SDK iOS 26)
        if: inputs.mode != 'metadata' && inputs.mode != 'submit'
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          # вывод — в переменную: xcodebuild падает (SIGPIPE), если пайп закрыть раньше (head -1, grep -q)
          V=$(xcodebuild -version)
          echo "$V"
          case "$V" in Xcode\ 2[6-9]*) ;; *) echo "::error title=Нет Xcode 26::на раннере ${{ runner.os }} нет Xcode 26 ($(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')) — выбери другой runner"; exit 1;; esac

      - name: Код приложения (закрытый репо, только чтение)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.ONETAP_REPO }}
          ssh-key: ${{ secrets.ONETAP_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
          show-progress: false

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # кэш только SDK и пакетов pub.dev (публичное); сборку и Pods не кэшируем — там скомпилированный код
          cache: true

      - name: Зависимости
        working-directory: app
        run: $GITHUB_WORKSPACE/scripts/quiet.sh pub-get flutter pub get

      - name: Анализ
        if: inputs.mode != 'metadata' && inputs.mode != 'submit'
        working-directory: app
        run: $GITHUB_WORKSPACE/scripts/quiet.sh analyze flutter analyze --fatal-infos

      - name: Тесты
        if: inputs.run_tests && inputs.mode != 'metadata' && inputs.mode != 'submit'
        working-directory: app
        run: $GITHUB_WORKSPACE/scripts/quiet.sh tests flutter test

      - name: Сборка без подписи (проверка)
        if: steps.pre.outputs.sign != 'true' && inputs.mode != 'metadata' && inputs.mode != 'submit'
        working-directory: app
        run: |
          $GITHUB_WORKSPACE/scripts/quiet.sh build-ios-nocodesign \
            flutter build ios --release --no-codesign \
              --dart-define=ONETAP_API_BASE_URL="$API_BASE_URL" \
              --dart-define=ONETAP_ALLOW_PREVIEW=true

      # ---------- дальше — только когда есть ключ App Store Connect ----------

      - name: Инструменты подписи (codemagic-cli-tools, открытые)
        if: steps.pre.outputs.sign == 'true' && inputs.mode == 'testflight'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cm"
          $GITHUB_WORKSPACE/scripts/quiet.sh cm-install "$RUNNER_TEMP/cm/bin/pip" install --quiet codemagic-cli-tools
          echo "$RUNNER_TEMP/cm/bin" >> "$GITHUB_PATH"

      - name: Подпись App Store (сертификат и профиль через API, без Mac и без match)
        if: steps.pre.outputs.sign == 'true' && inputs.mode == 'testflight'
        working-directory: app
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          Q=$GITHUB_WORKSPACE/scripts/quiet.sh
          # идея: постоянный CERTIFICATE_PRIVATE_KEY → каждый раз тот же сертификат, лимит сертификатов Apple не съедаем
          $Q keychain-init keychain initialize
          $Q fetch-signing app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          $Q keychain-add keychain add-certificates
          $Q use-profiles xcode-project use-profiles

      - name: Сборка IPA
        if: steps.pre.outputs.sign == 'true' && inputs.mode == 'testflight'
        working-directory: app
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # номер сборки = последний в TestFlight + 1 (пока id карточки не вписан — номер запуска + 100)
          LATEST=0
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -dc '0-9' || true)
            LATEST=${LATEST:-0}
          fi
          RUN=$(( GITHUB_RUN_NUMBER + 100 ))
          NEXT=$(( LATEST + 1 > RUN ? LATEST + 1 : RUN ))
          echo "номер сборки: $NEXT"
          $GITHUB_WORKSPACE/scripts/quiet.sh build-ipa \
            flutter build ipa --release \
              --build-number="$NEXT" \
              --export-options-plist="$HOME/export_options.plist" \
              --dart-define=ONETAP_API_BASE_URL="$API_BASE_URL" \
              --dart-define=ONETAP_ALLOW_PREVIEW=true

      - name: Загрузка в TestFlight (внутренние тестировщики, на проверку Apple НЕ отправляет)
        if: steps.pre.outputs.sign == 'true' && inputs.mode == 'testflight'
        working-directory: app
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error title=Нет IPA::сборка не дала файл"; exit 1; }
          echo "размер IPA: $(( $(wc -c < "$IPA") / 1048576 )) МБ"
          $GITHUB_WORKSPACE/scripts/quiet.sh upload app-store-connect publish --path "$IPA"

      - name: Ruby (для fastlane deliver)
        if: steps.pre.outputs.sign == 'true' && (inputs.mode == 'metadata' || inputs.mode == 'submit')
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: "3.3"
          working-directory: app
          bundler-cache: false

      - name: Тексты и скрины App Store
        if: steps.pre.outputs.sign == 'true' && (inputs.mode == 'metadata' || inputs.mode == 'submit')
        working-directory: app
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_REVIEW_EMAIL: ${{ secrets.APPLE_REVIEW_EMAIL }}
          APPLE_REVIEW_PASSWORD: ${{ secrets.APPLE_REVIEW_PASSWORD }}
          APPLE_REVIEW_NOTES: "Free B2B ordering app, no paid content or IAP. To sign in as a reviewer: on the login screen tap «Войти по email и паролю» (Sign in with email and password) and use the demo account. Phone-code login sends the code to Telegram and is not available to reviewers."
          BUILD_NUMBER: ${{ inputs.build_number }}
          BRAND_RIGHTS_CONFIRMED: "true"
        run: |
          set -euo pipefail
          # Fastfile ждёт ключ в base64 под старыми именами
          ASC_API_KEY_BASE64="$(printf '%s' "$P8" | base64 | tr -d '\n')"
          echo "::add-mask::$ASC_API_KEY_BASE64"
          export ASC_API_KEY_BASE64
          export APP_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          export UPLOAD_SCREENSHOTS=$([ "$MODE" = metadata ] && echo true || echo false)
          $GITHUB_WORKSPACE/scripts/quiet.sh bundle-install bundle install
          cd ios
          # при падении — хвост лога без строк с данными ревьюера (репо и лог публичные)
          tailsafe() { tail -n 60 "$RUNNER_TEMP"/logs/*-"$1".log | grep -iv 'password\|demo_\|APPLE_REVIEW' || true; }
          $GITHUB_WORKSPACE/scripts/quiet.sh deliver bundle exec fastlane ios upload_store_metadata || { tailsafe deliver; exit 1; }
          # состояние версий в App Store Connect (версия, статус, сборка, «Что нового» — не секрет)
          asc_state() { bundle exec ruby -r spaceship -r base64 -e '
              Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(key_id: ENV["ASC_API_KEY_ID"], issuer_id: ENV["ASC_API_ISSUER_ID"], key: Base64.decode64(ENV["ASC_API_KEY_BASE64"]))
              app = Spaceship::ConnectAPI::App.find(ENV["BUNDLE_ID"])
              app.get_app_store_versions(includes: "build").each { |v|
                st = v.respond_to?(:app_version_state) && v.app_version_state ? v.app_version_state : v.app_store_state
                puts "ASC: #{v.version_string} #{st} build=#{v.build && v.build.version}"
                next unless v.version_string == ENV["APP_VERSION"]
                v.get_app_store_version_localizations.each { |l| puts "ASC-loc: #{l.locale} whatsNew=#{l.whats_new.to_s.gsub("\n", " / ")[0, 90]}" }
              }' 2>&1 | grep '^ASC'; }
          if [ "$MODE" = submit ]; then
            asc_state | tee "$RUNNER_TEMP/asc-state.txt"
            # замок: русское «Что нового» этой версии в ASC = первая строка ru-RU/release_notes.txt ветки
            # (25.11, 0.2.2: раньше замок ждал текст 0.2.1 «Демо-режим»)
            want=$(python3 -c 'import sys; print(open(sys.argv[1], encoding="utf-8").readline().strip()[:40])' fastlane/metadata/ru-RU/release_notes.txt)
            [ -n "$want" ] || { echo "::error title=Нет русского «Что нового»::пустой ru-RU/release_notes.txt — отправку не делаю"; exit 1; }
            grep -qF "ASC-loc: ru whatsNew=$want" "$RUNNER_TEMP/asc-state.txt" || { echo "::error title=Нет русского «Что нового»::в ASC у $APP_VERSION русский текст не совпал с веткой ($want) — отправку не делаю"; exit 1; }
            $GITHUB_WORKSPACE/scripts/quiet.sh submit bundle exec fastlane ios submit_review || { tailsafe submit; exit 1; }
            asc_state || echo "::warning::проверка состояния после отправки не удалась (отправка выше прошла)"
          fi

      # ---------- итог и уборка ----------

      - name: Итог
        if: always()
        run: |
          {
            echo "### iOS: ${MODE}"
            echo "- ветка: \`${{ inputs.ref }}\`"
            echo "- подпись и загрузка: ${{ steps.pre.outputs.sign == 'true' && 'да' || 'нет (ждёт ключ App Store Connect или режим build-check)' }}"
            echo "- результат: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Зашифровать логи
        if: failure()
        run: $GITHUB_WORKSPACE/scripts/encrypt-logs.sh

      - name: Зашифрованный лог (артефакт на 2 дня)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-encrypted
          path: ${{ runner.temp }}/logs.tgz.p7m
          retention-days: 2
          if-no-files-found: ignore

      - name: Уборка
        if: always()
        run: |
          # машина одноразовая, но ключи и код всё равно стираем сразу
          rm -rf "$APP_DIR" "$RUNNER_TEMP/logs" "$HOME/.appstoreconnect" "$HOME/export_options.plist" || true
          command -v keychain >/dev/null && keychain use-login >/dev/null 2>&1 || true

  # 25.11: только чтение состояния версии iOS в App Store Connect (без сборки и отправки) — Диас: «App Store ещё не вышел? В чём проблема?»
  status:
    if: ${{ inputs.mode == 'status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Состояние App Store Connect (только чтение)
        env:
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP: ${{ vars.APP_STORE_APPLE_ID || '6829345779' }}
        run: |
          node -e '
          const c = require("crypto"), b = (o) => Buffer.from(JSON.stringify(o)).toString("base64url"), now = Math.floor(Date.now() / 1000);
          const h = b({ alg: "ES256", kid: process.env.KID, typ: "JWT" }), p = b({ iss: process.env.ISS, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
          const t = h + "." + p + "." + c.sign("sha256", Buffer.from(h + "." + p), { key: process.env.P8, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const g = async (u) => (await fetch("https://api.appstoreconnect.apple.com/v1/" + u, { headers: { authorization: "Bearer " + t } })).json();
          (async () => {
            const v = await g("apps/" + process.env.APP + "/appStoreVersions?filter[platform]=IOS&limit=3&fields[appStoreVersions]=versionString,appStoreState,appVersionState,releaseType,createdDate");
            if (v.errors) console.log("ASC-ошибка:", JSON.stringify(v.errors).slice(0, 300));
            for (const x of v.data || []) console.log("ASC:", x.attributes.versionString, x.attributes.appVersionState || "", x.attributes.appStoreState || "", x.attributes.releaseType || "", x.attributes.createdDate || "");
            const r = await g("apps/" + process.env.APP + "/reviewSubmissions?filter[platform]=IOS&limit=3");
            for (const x of r.data || []) console.log("REVIEW:", x.attributes.state, x.attributes.submittedDate || "");
            // 25.11: последние сборки TestFlight — номер и обработка (VALID = можно отправлять на проверку)
            const bl = await g("builds?filter[app]=" + process.env.APP + "&sort=-uploadedDate&limit=3&fields[builds]=version,processingState,uploadedDate");
            for (const x of bl.data || []) console.log("BUILD:", x.attributes.version, x.attributes.processingState || "", x.attributes.uploadedDate || "");
          })().catch((e) => { console.log("ошибка:", e.message); process.exit(1); });'

  # 25.11: выпуск одобренной версии iOS (releaseType MANUAL) — правило Диаса: iPhone и Android выходят вместе.
  # Выпускает только версию из release_version и только из PENDING_DEVELOPER_RELEASE; сборку, тексты и отправку не трогает.
  # Шаги раздельно: «Выпуск» зелёный = Apple приняла запрос (201) — по нему сразу жмём «Опубликовать» в Google Play.
  release:
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP: ${{ vars.APP_STORE_APPLE_ID || '6829345779' }}
      VER: ${{ inputs.release_version }}
    steps:
      - name: Скрипт App Store Connect
        run: |
          cat > "$RUNNER_TEMP/asc.js" <<'JS'
          const c = require("crypto"), b = (o) => Buffer.from(JSON.stringify(o)).toString("base64url"), now = Math.floor(Date.now() / 1000);
          const h = b({ alg: "ES256", kid: process.env.KID, typ: "JWT" }), p = b({ iss: process.env.ISS, iat: now, exp: now + 900, aud: "appstoreconnect-v1" });
          const t = h + "." + p + "." + c.sign("sha256", Buffer.from(h + "." + p), { key: process.env.P8, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const api = async (u, body) => {
            const r = await fetch("https://api.appstoreconnect.apple.com/v1/" + u, body
              ? { method: "POST", headers: { authorization: "Bearer " + t, "content-type": "application/json" }, body: JSON.stringify(body) }
              : { headers: { authorization: "Bearer " + t } });
            return { status: r.status, j: await r.json().catch(() => ({})) };
          };
          const show = (x) => console.log("ASC:", x.attributes.versionString, x.attributes.appVersionState || "", x.attributes.appStoreState || "", x.attributes.releaseType || "", x.attributes.createdDate || "");
          const list = async () => {
            const { j } = await api("apps/" + process.env.APP + "/appStoreVersions?filter[platform]=IOS&limit=3&fields[appStoreVersions]=versionString,appStoreState,appVersionState,releaseType,createdDate");
            if (j.errors) console.log("ASC-ошибка:", JSON.stringify(j.errors).slice(0, 300));
            (j.data || []).forEach(show);
            return j.data || [];
          };
          const ver = (process.env.VER || "").trim(), step = process.argv[2];
          (async () => {
            if (!/^\d+\.\d+\.\d+$/.test(ver)) { console.log("::error title=Нет версии::укажи release_version, например 0.2.1"); process.exit(1); }
            console.log(step === "release" ? "до выпуска:" : "сейчас:");
            const v = (await list()).find((x) => x.attributes.versionString === ver);
            if (!v) { console.log("::error title=Нет версии::" + ver + " (iOS) нет в App Store Connect"); process.exit(1); }
            if (step === "release") {
              const st = v.attributes.appVersionState || v.attributes.appStoreState;
              if (st !== "PENDING_DEVELOPER_RELEASE") { console.log("::error title=Не ждёт выпуска::" + ver + " в состоянии " + st + " — выпуск не делаю"); process.exit(1); }
              const r = await api("appStoreVersionReleaseRequests", { data: { type: "appStoreVersionReleaseRequests", relationships: { appStoreVersion: { data: { type: "appStoreVersions", id: v.id } } } } });
              console.log("RELEASE:", r.status, r.j.data ? "request=" + r.j.data.id : "", r.j.errors ? JSON.stringify(r.j.errors).slice(0, 400) : "");
              if (r.status !== 201) process.exit(1);
              return;
            }
            // после запроса Apple сама: PROCESSING_FOR_DISTRIBUTION → READY_FOR_DISTRIBUTION (обычно минуты)
            for (let i = 1; i <= 12; i++) {
              await new Promise((ok) => setTimeout(ok, 15000));
              const a = ((await api("appStoreVersions/" + v.id + "?fields[appStoreVersions]=versionString,appStoreState,appVersionState")).j.data || {}).attributes || {};
              console.log("через", i * 15, "с:", a.versionString, a.appVersionState || "", a.appStoreState || "");
              if (a.appVersionState === "READY_FOR_DISTRIBUTION" || a.appStoreState === "READY_FOR_SALE") break;
            }
            console.log("после выпуска:");
            await list();
          })().catch((e) => { console.log("ошибка:", e.message); process.exit(1); });
          JS

      - name: Выпуск одобренной версии в App Store
        run: node "$RUNNER_TEMP/asc.js" release

      - name: Состояние после выпуска
        run: node "$RUNNER_TEMP/asc.js" after

  # 25.11 (0.2.2): поле номера на настоящем iOS — симулятор iPhone + XCUITest, пальцем по экранной клавиатуре.
  # Сборка debug под симулятор с флагами сторов (прод-API); UI-тест добавляется только в копию проекта на машине.
  # Наружу — только скрины и текст результата (артефакт на 1 день); код и сборка приложения не выкладываются.
  simtest:
    if: ${{ inputs.mode == 'simtest' }}
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      FLUTTER_VERSION: 3.47.7
      SIMTEST_SUBMIT: ${{ inputs.simtest_submit && 'true' || 'false' }}
    steps:
      - name: Скрипты сборщика
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Xcode 26
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          V=$(xcodebuild -version)
          echo "$V"

      - name: Код приложения (закрытый репо, только чтение)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.ONETAP_REPO }}
          ssh-key: ${{ secrets.ONETAP_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
          show-progress: false

      - name: Версия приложения
        working-directory: app
        run: |
          echo "версия $(grep '^version:' pubspec.yaml | sed 's/version: *//'), коммит $(git rev-parse --short HEAD)"

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        working-directory: app
        run: $GITHUB_WORKSPACE/scripts/quiet.sh pub-get flutter pub get

      - name: Проект под симулятор (debug, флаги как у сторов)
        working-directory: app
        run: |
          $GITHUB_WORKSPACE/scripts/quiet.sh sim-config \
            flutter build ios --simulator --debug --config-only \
              --dart-define=ONETAP_API_BASE_URL="$API_BASE_URL" \
              --dart-define=ONETAP_ALLOW_PREVIEW=true

      - name: UI-тест в копию проекта
        working-directory: app/ios
        run: |
          set -euo pipefail
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}, ruby #{RUBY_VERSION}"'
          ruby "$GITHUB_WORKSPACE/simtest/add_uitest_target.rb" "$GITHUB_WORKSPACE/simtest"

      - name: Симулятор iPhone (экранная клавиатура)
        id: sim
        run: |
          set -euo pipefail
          PICK=$(xcrun simctl list devices available -j | python3 "$GITHUB_WORKSPACE/simtest/pick_sim.py")
          read -r UDID RUNTIME NAME <<< "$PICK"
          echo "симулятор: $NAME, iOS $RUNTIME"
          # без аппаратной клавиатуры: набор идёт через экранную, как у людей
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME, iOS $RUNTIME" >> "$GITHUB_OUTPUT"

      - name: XCUITest — набор, стирание, «Получить код»
        working-directory: app/ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e -uo pipefail   # шаг сам решает код выхода: упавший тест не должен прятать строки результата
          mkdir -p "$RUNNER_TEMP/simtest" "$RUNNER_TEMP/logs"
          export TEST_RUNNER_SIMTEST_OUT="$RUNNER_TEMP/simtest"
          export TEST_RUNNER_SIMTEST_SUBMIT="$SIMTEST_SUBMIT"
          LOG="$RUNNER_TEMP/logs/90-xcodebuild-test.log"
          start=$(date +%s)
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "id=$UDID" -only-testing:RunnerUITests \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/simtest.xcresult" >"$LOG" 2>&1
          code=$?
          echo "xcodebuild test: код $code, $(( $(date +%s) - start )) с"
          # в публичный лог — только строки теста и ошибки без исходников приложения
          grep -E "SIMTEST\[|Test [Cc]ase .*(passed|failed|skipped)|\*\* TEST|error:|Testing failed|failed to|Failed to" "$LOG" \
            | grep -v -E "/app/lib/|/app/test/" | cut -c1-400 | head -150 || true
          exit $code

      - name: Результат и скрины
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/simtest.xcresult" --output-path "$RUNNER_TEMP/simtest/att" >/dev/null 2>&1 || echo "вложения из xcresult не выгрузились"
          ls "$RUNNER_TEMP/simtest" "$RUNNER_TEMP/simtest/att" 2>/dev/null | head -60 || true
          {
            echo "### simtest: \`${{ inputs.ref }}\` — ${{ steps.sim.outputs.name }}"
            for f in "$RUNNER_TEMP"/simtest/result-*.txt; do
              [ -f "$f" ] && { echo '```'; cat "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP"/simtest/result-*.txt 2>/dev/null || echo "файлов результата нет"

      - name: Скрины (артефакт на 1 день — только PNG и текст)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simtest-shots
          path: |
            ${{ runner.temp }}/simtest/*.png
            ${{ runner.temp }}/simtest/*.txt
            ${{ runner.temp }}/simtest/att/*.png
            ${{ runner.temp }}/simtest/att/*.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Зашифровать логи
        if: failure()
        run: $GITHUB_WORKSPACE/scripts/encrypt-logs.sh

      - name: Зашифрованный лог (артефакт на 2 дня)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-encrypted
          path: ${{ runner.temp }}/logs.tgz.p7m
          retention-days: 2
          if-no-files-found: ignore

      - name: Уборка
        if: always()
        run: |
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          rm -rf "$GITHUB_WORKSPACE/app" "$RUNNER_TEMP/dd" "$RUNNER_TEMP/simtest.xcresult" "$RUNNER_TEMP/logs" || true

  # 25.11 (0.2.2): то же на Android — эмулятор из образа раннера (sdkmanager, avdmanager, emulator; KVM), без чужих actions.
  # Сборка release только под x86_64 и с отладочной подписью — для эмулятора, не для Google Play. Наружу — только скрины и текст.
  emutest:
    if: ${{ inputs.mode == 'emutest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      FLUTTER_VERSION: 3.47.7
      SIMTEST_SUBMIT: ${{ inputs.simtest_submit && 'true' || 'false' }}
      IMG: system-images;android-35;google_apis;x86_64
    steps:
      - name: Скрипты сборщика
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Код приложения (закрытый репо, только чтение)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.ONETAP_REPO }}
          ssh-key: ${{ secrets.ONETAP_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
          show-progress: false

      - name: Версия приложения
        working-directory: app
        run: |
          echo "версия $(grep '^version:' pubspec.yaml | sed 's/version: *//'), коммит $(git rev-parse --short HEAD)"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        working-directory: app
        run: $GITHUB_WORKSPACE/scripts/quiet.sh pub-get flutter pub get

      - name: APK для эмулятора (release, x86_64, флаги как у сторов)
        working-directory: app
        run: |
          $GITHUB_WORKSPACE/scripts/quiet.sh build-apk \
            flutter build apk --release --target-platform android-x64 \
              --dart-define=ONETAP_API_BASE_URL="$API_BASE_URL" \
              --dart-define=ONETAP_ALLOW_PREVIEW=true

      - name: Эмулятор Android (KVM, образ из sdkmanager)
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          B="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          $GITHUB_WORKSPACE/scripts/quiet.sh sdk-image bash -c "yes | '$B/sdkmanager' --install '$IMG' emulator platform-tools"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$B/avdmanager" create avd --force -n onetap -k "$IMG" -d pixel_6 -p "$ANDROID_AVD_HOME/onetap.avd" >/dev/null
          "$B/avdmanager" list avd | grep -E "Name:|Path:" || true
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd onetap -no-window -no-audio -no-boot-anim -no-snapshot -accel on \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 >"$RUNNER_TEMP/emulator.log" 2>&1 &
          EPID=$!
          ok=0
          for i in $(seq 1 200); do
            if ! kill -0 "$EPID" 2>/dev/null; then echo "::error title=Эмулятор упал::см. лог ниже"; tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; fi
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { ok=1; break; }
            sleep 3
          done
          adb devices
          [ "$ok" = 1 ] || { echo "::error title=Эмулятор не загрузился::boot_completed нет за 10 мин"; tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; }
          echo "загрузился за $((i * 3)) с"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r'), клавиатура: $(adb shell settings get secure default_input_method | tr -d '\r')"

      - name: Набор, стирание, «Получить код» (Android)
        run: |
          set +e -uo pipefail
          adb install -r app/build/app/outputs/flutter-apk/app-release.apk >/dev/null
          bash "$GITHUB_WORKSPACE/simtest/android_phone.sh" "$RUNNER_TEMP/simtest" "$SIMTEST_SUBMIT"

      - name: Результат
        if: always()
        run: |
          {
            echo "### emutest: \`${{ inputs.ref }}\`"
            [ -f "$RUNNER_TEMP/simtest/result-a.txt" ] && { echo '```'; cat "$RUNNER_TEMP/simtest/result-a.txt"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
          ls "$RUNNER_TEMP/simtest" 2>/dev/null || true

      - name: Скрины (артефакт на 1 день — только PNG и текст)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emutest-shots
          path: |
            ${{ runner.temp }}/simtest/*.png
            ${{ runner.temp }}/simtest/*.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Уборка
        if: always()
        run: |
          adb emu kill >/dev/null 2>&1 || true
          rm -rf "$GITHUB_WORKSPACE/app" "$RUNNER_TEMP/logs" || true
